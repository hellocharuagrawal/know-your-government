name = "know-your-government-api"
main = "src/index.js"
compatibility_date = "2024-09-01"

[[kv_namespaces]]
binding = "GOVT_DATA"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[triggers]
# Runs at 4am UTC, one hour after the GitHub Actions scraper (3am UTC),
# giving it time to finish and commit fresh data first.
crons = ["0 4 * * *"]
